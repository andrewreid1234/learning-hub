<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamieson Lab Learning Hub</title>
<style>
  :root {
    --paper:#F6F7F2; --paper-raised:#FFFFFF; --ink:#1C2620; --muted:#5F6B64; --muted-2:#8C9790;
    --teal:#2F5D5A; --teal-dark:#20423F; --teal-bg:rgba(47,93,90,.08);
    --amber:#A85F1B; --amber-bg:rgba(193,117,43,.12);
    --line:#D7DBD3; --line-strong:#C3C9BE; --good:#3F7A52; --good-bg:rgba(63,122,82,.12);
    --danger:#A8402E; --danger-bg:rgba(168,64,46,.10);
    --code-bg:#182420; --code-bg-raised:#1F2E29; --code-text:#DDE4DE; --code-muted:#7C9089; --code-var:#F0AE68;
    --radius:8px;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#141E1A; --paper-raised:#1B2723; --ink:#E9ECE7; --muted:#93A69D; --muted-2:#6C7D75;
      --teal:#6FBDB6; --teal-dark:#8FD4CD; --teal-bg:rgba(111,189,182,.10);
      --amber:#E2A25C; --amber-bg:rgba(226,162,92,.14);
      --line:#2B3B35; --line-strong:#3A4D46; --good:#7FC796; --good-bg:rgba(127,199,150,.12);
      --danger:#E08674; --danger-bg:rgba(224,134,116,.12);
      --code-bg:#101917; --code-bg-raised:#17211E;
    }
  }
  :root[data-theme="dark"] {
    --paper:#141E1A; --paper-raised:#1B2723; --ink:#E9ECE7; --muted:#93A69D; --muted-2:#6C7D75;
    --teal:#6FBDB6; --teal-dark:#8FD4CD; --teal-bg:rgba(111,189,182,.10);
    --amber:#E2A25C; --amber-bg:rgba(226,162,92,.14);
    --line:#2B3B35; --line-strong:#3A4D46; --good:#7FC796; --good-bg:rgba(127,199,150,.12);
    --danger:#E08674; --danger-bg:rgba(224,134,116,.12);
    --code-bg:#101917; --code-bg-raised:#17211E;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
  a{color:var(--teal)}
  code,.mono{font-family:var(--mono);font-size:.88em}
  :not(pre)>code{background:var(--teal-bg);padding:.1em .35em;border-radius:4px}
  button{font:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* layout */
  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  .side{background:var(--paper-raised);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-weight:600;letter-spacing:.01em;margin:0 0 2px}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
  .side h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
  .side a.nav{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.92rem}
  .side a.nav:hover{background:var(--teal-bg)}
  .side a.nav.active{background:var(--teal-bg);color:var(--teal-dark);font-weight:600}
  .tick{flex:0 0 16px;height:16px;margin-top:3px;border:1.5px solid var(--line-strong);border-radius:50%;font-size:10px;line-height:13px;text-align:center;color:transparent}
  .done .tick{background:var(--good);border-color:var(--good);color:#fff}
  .modtag{font-size:.7rem;color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:0 6px;margin-left:6px;white-space:nowrap}
  .osbox .seg{width:100%}.osbox .seg button{flex:1;padding:4px 6px}
  .osblock{border-left:3px solid var(--line-strong);padding-left:14px;margin:1em 0}
  .oslabel{font-size:.78rem;color:var(--muted);margin-bottom:4px}
  .tools{display:flex;gap:8px;margin-top:22px}
  .tools button{flex:1;background:none;border:1px solid var(--line-strong);color:var(--muted);border-radius:6px;padding:5px;font-size:.8rem}
  main{padding:32px clamp(16px,4vw,56px) 80px;max-width:900px;width:100%}
  .topbar{display:none}
  h1{font-size:2rem;line-height:1.2;margin:.2em 0 .3em}
  h2{font-size:1.35rem;margin:2em 0 .5em;padding-top:.4em;border-top:1px solid var(--line)}
  h3.sub{font-size:1.05rem;margin:1.6em 0 .3em}
  .crumb{color:var(--muted);font-size:.85rem}
  p{margin:.7em 0}
  ul,ol{padding-left:1.3em}
  li{margin:.25em 0}

  /* blocks */
  pre{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:var(--radius);overflow:auto;font-family:var(--mono);font-size:.84rem;line-height:1.5;margin:0}
  .codewrap{position:relative;margin:1em 0}
  .codelabel{display:flex;justify-content:space-between;align-items:center;background:var(--code-bg-raised);color:var(--code-muted);font-family:var(--mono);font-size:.75rem;padding:5px 10px 5px 16px;border-radius:var(--radius) var(--radius) 0 0}
  .codelabel+pre{border-radius:0 0 var(--radius) var(--radius)}
  .copy{background:none;border:1px solid var(--code-muted);color:var(--code-text);border-radius:5px;font-size:.72rem;padding:2px 9px}
  .copy:hover{background:rgba(255,255,255,.08)}
  .copy.ok{border-color:var(--good);color:var(--good)}
  .swap{color:var(--code-var);background:rgba(240,174,104,.16);border-radius:3px}
  .callout{border-left:4px solid var(--teal);background:var(--teal-bg);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;margin:1.1em 0}
  .callout .label{display:block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
  .callout p:first-child{margin-top:0}.callout p:last-child{margin-bottom:0}
  .callout-safety,.callout-mistake{border-color:var(--danger);background:var(--danger-bg)}
  .callout-safety .label,.callout-mistake .label{color:var(--danger)}
  .callout-note,.callout-practice{border-color:var(--amber);background:var(--amber-bg)}
  .callout-note .label,.callout-practice .label{color:var(--amber)}
  table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.9rem;display:block;overflow-x:auto}
  th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  th{background:var(--teal-bg);font-weight:600}
  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:1.2em 0}
  .card h4{margin:0 0 .5em;font-size:.95rem}
  .checklist label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
  .checklist input{margin-top:.35em;accent-color:var(--teal)}
  .checklist input:checked+span{color:var(--muted);text-decoration:line-through}
  .quiz .opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;padding:8px 12px;margin:6px 0;color:var(--ink)}
  .quiz .opt:hover:not(:disabled){border-color:var(--teal)}
  .quiz .opt.right{border-color:var(--good);background:var(--good-bg)}
  .quiz .opt.wrong{border-color:var(--danger);background:var(--danger-bg)}
  .quiz .why{margin-top:8px;font-size:.9rem;color:var(--muted)}
  .pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:.75rem;border:1px solid var(--line-strong);color:var(--muted)}
  .pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--amber);border-color:var(--amber)} .pill.bad{color:var(--danger);border-color:var(--danger)}

  /* forms */
  label.f{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 3px}
  input[type=text],input[type=number],select,textarea{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;font:inherit;font-size:.92rem}
  textarea{font-family:var(--mono);font-size:.82rem;min-height:84px;resize:vertical}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-size:.88rem}
  .btn.ghost{background:none;color:var(--teal);border:1px solid var(--teal)}
  .callout-todo{border-color:var(--amber);background:var(--amber-bg)}
  .callout-todo .label{color:var(--amber)}
  .btn.small{padding:3px 10px;font-size:.8rem}
  .btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
  .msgs{margin:8px 0 0;padding:0;list-style:none;font-size:.86rem}
  .msgs li{padding:2px 0}.msgs .err{color:var(--danger)}.msgs .wrn{color:var(--amber)}.msgs .okk{color:var(--good)}
  .ent{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0;background:var(--paper)}
  .ent header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
  .seg button{background:none;border:0;padding:4px 12px;color:var(--ink);font-size:.85rem}
  .seg button.on{background:var(--teal);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chips button{background:var(--paper);border:1px solid var(--line-strong);border-radius:14px;padding:3px 12px;font-size:.82rem;color:var(--ink)}
  .chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  details.param{border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;background:var(--paper-raised)}
  details.param summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  details.param summary code{font-weight:600}
  details.param .pbody{padding:0 14px 12px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:.9rem}
  .kv dt{color:var(--muted)}.kv dd{margin:0}
  canvas{max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
  .nav2{display:flex;justify-content:space-between;gap:12px;margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line)}
  .nav2 a,.nav2 button{border:1px solid var(--line-strong);border-radius:6px;padding:8px 14px;text-decoration:none;color:var(--ink);background:var(--paper-raised)}
  .nav2 .primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .hero{padding:12px 0 8px}
  .coursecard{display:block;text-decoration:none;color:var(--ink);background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:14px 0}
  .coursecard:hover{border-color:var(--teal)}
  .bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}

  @media (max-width: 860px){
    .app{display:block}
    .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:20;transform:translateX(-100%);transition:transform .2s}
    body.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
    .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--paper-raised);position:sticky;top:0;z-index:10}
    .topbar button{background:none;border:1px solid var(--line-strong);border-radius:6px;padding:4px 10px;color:var(--ink)}
    main{padding:20px 16px 64px}
  }
  @media print{
    .side,.topbar,.nav2,.copy,.noprint{display:none!important}
    .app{display:block} body{background:#fff;color:#000}
    pre{background:#f3f3f3;color:#000;border:1px solid #bbb} .codelabel{background:#e5e5e5;color:#333}
    main{max-width:none;padding:0}
  }
</style>
</head>
<body>
<div class="topbar"><button id="menuBtn" aria-label="Open menu">Menu</button><strong>Learning Hub</strong></div>
<div class="app">
  <nav class="side" id="side" aria-label="Course navigation"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
/* Learning Hub engine.
 * A course is plain data: {id,title,blurb,modules:[{id,title,skippable,lessons:[{id,title,blocks:[...]}]}]}
 * Register with Hub.register(course); register custom widgets with Hub.widget(name, fn(el, props)).
 * Block types: h, p, list, code, callout, table, check, quiz, widget, html.
 */
(function () {
  'use strict';
  var courses = [], widgets = {}, store = {};
  var KEY = 'jlhub.progress.v1', OSKEY = 'jlhub.os.v1';
  var OSES = [['win', 'Windows'], ['mac', 'Mac'], ['linux', 'Linux']];
  var osName = detectOS();
  function detectOS() {
    try { var v = localStorage.getItem(OSKEY); if (v) return v; } catch (e) { /* storage blocked */ }
    var ua = (navigator.userAgent + ' ' + (navigator.platform || '')).toLowerCase();
    return /win/.test(ua) ? 'win' : /mac|iphone|ipad/.test(ua) ? 'mac' : 'linux';
  }
  function setOS(v) { osName = v; try { localStorage.setItem(OSKEY, v); } catch (e) { /* storage blocked */ } }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function load() { try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage blocked: progress just won't persist */ } }
  function isDone(cid, lid) { return !!(store[cid] && store[cid][lid]); }
  function setDone(cid, lid, v) { store[cid] = store[cid] || {}; if (v) store[cid][lid] = 1; else delete store[cid][lid]; save(); }
  function flatLessons(c) {
    var out = [];
    c.modules.forEach(function (m) { m.lessons.forEach(function (l) { out.push({ m: m, l: l }); }); });
    return out;
  }
  function copyText(text, btn) {
    function ok() { if (!btn) return; var t = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('ok'); setTimeout(function () { btn.textContent = t; btn.classList.remove('ok'); }, 1400); }
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(ok, fallback); } else fallback();
    function fallback() {
      var ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { if (btn) btn.textContent = 'Select + Ctrl-C'; }
      document.body.removeChild(ta);
    }
  }

  /* code block: text may mark swap-in parts as [[like this]] (highlighted, brackets stripped when copied) */
  function codeBlock(text, label) {
    var raw = text.replace(/\[\[(.*?)\]\]/g, '$1');
    var shown = esc(text).replace(/\[\[(.*?)\]\]/g, '<span class="swap">$1</span>');
    var wrap = el('div', { class: 'codewrap' });
    var bar = el('div', { class: 'codelabel' }, '<span>' + esc(label || '') + '</span>');
    var btn = el('button', { class: 'copy', type: 'button' }, 'Copy');
    btn.onclick = function () { copyText(raw, btn); };
    bar.appendChild(btn);
    wrap.appendChild(bar);
    wrap.appendChild(el('pre', null, '<code>' + shown + '</code>'));
    return wrap;
  }

  /* ---------- block renderers ---------- */
  var R = {
    h: function (b) { return el('h2', { id: b.id || '' }, esc(b.text)); },
    sub: function (b) { return el('h3', { class: 'sub' }, esc(b.text)); },
    p: function (b) { return el('p', null, b.html); },
    html: function (b) { var d = el('div', null, b.html); return d; },
    list: function (b) { var l = el(b.ordered ? 'ol' : 'ul'); b.items.forEach(function (i) { l.appendChild(el('li', null, i)); }); return l; },
    code: function (b) { return codeBlock(b.text, b.label); },
    callout: function (b) {
      var k = b.kind || 'summary';
      return el('div', { class: 'callout callout-' + k }, '<span class="label">' + esc(b.label || k) + '</span><div>' + b.html + '</div>');
    },
    table: function (b) {
      var h = '<table><thead><tr>' + b.head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
        b.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      var d = el('div', null, h); return d;
    },
    check: function (b, ctx) {
      var card = el('div', { class: 'card checklist' }, '<h4>' + esc(b.title || 'Checkpoint') + '</h4>');
      var k = ctx.cid + '/' + ctx.lid + '/' + (b.id || b.title);
      var saved = (store._checks && store._checks[k]) || {};
      b.items.forEach(function (it, i) {
        var lab = el('label'), cb = el('input', { type: 'checkbox' });
        cb.checked = !!saved[i];
        cb.onchange = function () { store._checks = store._checks || {}; store._checks[k] = store._checks[k] || {}; store._checks[k][i] = cb.checked ? 1 : 0; save(); };
        lab.appendChild(cb); lab.appendChild(el('span', null, it)); card.appendChild(lab);
      });
      return card;
    },
    quiz: function (b, ctx) {
      var card = el('div', { class: 'card quiz' }, '<h4>Check yourself</h4><div>' + b.q + '</div>');
      var why = el('div', { class: 'why' }); why.hidden = true;
      var btns = [];
      b.opts.forEach(function (o, i) {
        var bt = el('button', { class: 'opt', type: 'button' }, o);
        bt.onclick = function () {
          btns.forEach(function (x, j) { x.disabled = true; if (j === b.answer) x.classList.add('right'); });
          if (i !== b.answer) bt.classList.add('wrong');
          why.hidden = false; why.innerHTML = (i === b.answer ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + b.why;
        };
        btns.push(bt); card.appendChild(bt);
      });
      card.appendChild(why);
      return card;
    },
    /* os: {t:'os', win:[blocks], mac:[blocks], linux:[blocks], other:[blocks]} shows the set for the reader's chosen OS */
    os: function (b, ctx) {
      var wrap = el('div', { class: 'osblock' });
      wrap.appendChild(el('div', { class: 'oslabel' }, 'Showing instructions for <strong>' + esc(OSES.filter(function (o) { return o[0] === osName; })[0][1]) + '</strong>. Change this under &ldquo;Your computer&rdquo; in the sidebar (or the Menu on a phone).'));
      (b[osName] || b.other || []).forEach(function (x) { var r = R[x.t]; if (r) wrap.appendChild(r(x, ctx)); });
      return wrap;
    },
    widget: function (b, ctx) {
      var host = el('div', { class: 'card' });
      var fn = widgets[b.name];
      if (!fn) { host.textContent = 'Missing widget: ' + b.name; return host; }
      try { fn(host, b.props || {}, ctx); } catch (e) { host.textContent = 'Widget error: ' + e.message; }
      return host;
    }
  };

  /* ---------- views ---------- */
  var side = null, main = null;

  function renderSide(route) {
    side.innerHTML = '';
    side.appendChild(el('p', { class: 'brand' }, 'Learning Hub<small>Jamieson Group</small>'));
    var home = el('a', { class: 'nav' + (!route.cid ? ' active' : ''), href: '#/' }, '<span>All courses</span>');
    side.appendChild(home);
    courses.forEach(function (c) {
      if (route.cid && route.cid !== c.id) return;
      side.appendChild(el('h3', null, esc(c.title)));
      c.modules.forEach(function (m) {
        side.appendChild(el('div', { style: 'font-size:.8rem;color:var(--muted);margin:10px 8px 2px' }, esc(m.title) + (m.skippable ? '<span class="modtag">skippable</span>' : '')));
        m.lessons.forEach(function (l) {
          var a = el('a', { class: 'nav' + (isDone(c.id, l.id) ? ' done' : '') + (route.lid === l.id ? ' active' : ''), href: '#/' + c.id + '/' + l.id },
            '<span class="tick">&#10003;</span><span>' + esc(l.title) + '</span>');
          side.appendChild(a);
        });
      });
    });
    var osBox = el('div', { class: 'osbox' }, '<h3>Your computer</h3>');
    var osSeg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Your operating system' });
    OSES.forEach(function (o) {
      var b = el('button', { type: 'button', class: o[0] === osName ? 'on' : '' }, o[1]);
      b.onclick = function () { var y = window.scrollY; setOS(o[0]); route_(true); window.scrollTo(0, y); };
      osSeg.appendChild(b);
    });
    osBox.appendChild(osSeg); side.appendChild(osBox);
    var tools = el('div', { class: 'tools' });
    var th = el('button', { type: 'button' }, 'Theme');
    th.onclick = function () {
      var cur = document.documentElement.getAttribute('data-theme');
      var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    };
    var pr = el('button', { type: 'button' }, 'Print page'); pr.onclick = function () { window.print(); };
    var rs = el('button', { type: 'button' }, 'Reset'); rs.title = 'Clear saved progress';
    rs.onclick = function () { if (confirm('Clear all saved progress and checklists?')) { store = {}; save(); route_(); } };
    tools.appendChild(th); tools.appendChild(pr); tools.appendChild(rs);
    side.appendChild(tools);
  }

  function renderHome() {
    main.innerHTML = '';
    main.appendChild(el('div', { class: 'hero' }, '<h1>Learning Hub</h1><p>Interactive, hands-on guides for the software we use in the group. Everything here is done by you, by hand, on your own terminal: nothing needs an AI assistant to run.</p>'));
    courses.forEach(function (c) {
      var all = flatLessons(c), n = all.filter(function (x) { return isDone(c.id, x.l.id); }).length;
      var first = all[0];
      main.appendChild(el('a', { class: 'coursecard', href: '#/' + c.id + '/' + first.l.id },
        '<strong style="font-size:1.15rem">' + esc(c.title) + '</strong><div style="color:var(--muted)">' + c.blurb + '</div>' +
        '<div style="font-size:.8rem;color:var(--muted);margin-top:8px">' + all.length + ' lessons &middot; ' + n + ' complete</div>' +
        '<div class="bar"><i style="width:' + Math.round(100 * n / all.length) + '%"></i></div>'));
    });
  }

  function renderLesson(c, lid, keepScroll) {
    var all = flatLessons(c), idx = all.findIndex(function (x) { return x.l.id === lid; });
    if (idx < 0) { location.hash = '#/' + c.id + '/' + all[0].l.id; return; }
    var cur = all[idx];
    main.innerHTML = '';
    main.appendChild(el('div', { class: 'crumb' }, esc(c.title) + ' &rsaquo; ' + esc(cur.m.title)));
    main.appendChild(el('h1', null, esc(cur.l.title)));
    if (cur.m.skippable && cur.m.lessons[0] === cur.l) {
      var nextMod = all.find(function (x) { return x.m !== cur.m; });
      if (nextMod) main.appendChild(el('div', { class: 'callout callout-note' },
        '<span class="label">Already comfortable?</span><div>This module is optional background. If you already SSH into Woody and use a terminal, <a href="#/' + c.id + '/' + nextMod.l.id + '">skip to ' + esc(nextMod.l.title) + '</a>.</div>'));
    }
    var ctx = { cid: c.id, lid: lid };
    cur.l.blocks.forEach(function (b) {
      var r = R[b.t]; if (!r) return;
      main.appendChild(r(b, ctx));
    });
    var done = isDone(c.id, lid);
    var nav = el('div', { class: 'nav2' });
    var prev = all[idx - 1], next = all[idx + 1];
    nav.appendChild(prev ? el('a', { href: '#/' + c.id + '/' + prev.l.id }, '&larr; ' + esc(prev.l.title)) : el('span'));
    var mk = el('button', { type: 'button', class: done ? '' : 'primary' }, done ? 'Completed (undo)' : (next ? 'Mark complete' : 'Mark course complete'));
    mk.onclick = function () {
      setDone(c.id, lid, !done);
      if (!done && next) location.hash = '#/' + c.id + '/' + next.l.id; else route_();
    };
    nav.appendChild(mk);
    nav.appendChild(next ? el('a', { href: '#/' + c.id + '/' + next.l.id }, esc(next.l.title) + ' &rarr;') : el('span'));
    main.appendChild(nav);
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function route_(keep) {
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    var c = courses.find(function (x) { return x.id === parts[0]; });
    var route = { cid: c && c.id, lid: parts[1] };
    renderSide(route);
    if (!c) renderHome(); else renderLesson(c, parts[1], keep === true);
    if (keep !== true) document.body.classList.remove('menu');
  }

  window.Hub = {
    register: function (c) { courses.push(c); },
    widget: function (name, fn) { widgets[name] = fn; },
    util: { esc: esc, el: el, copyText: copyText, codeBlock: codeBlock },
    start: function () {
      load();
      side = document.getElementById('side'); main = document.getElementById('main');
      document.getElementById('menuBtn').onclick = function () { document.body.classList.toggle('menu'); };
      window.addEventListener('hashchange', route_);
      route_();
    }
  };
})();

</script>

<script>
/* AlphaFold3 course widgets: jsonbuilder, cmdbuilder, paramref, resulttrainer, scorecalc, triage */
(function () {
  'use strict';
  var U = Hub.util, esc = U.esc, el = U.el;

  var FFA4 = 'RTRFPFFSDVKGDHRLVLAAVETTVLVLIFAVSLLGNVCALVLVARRRRRGATACLVLNLFCADLLFISAIPLVLAVRWTEAWLLGPVACHLLFYVMTLSGSVTILTLAAVSLERMVCIVHLQRGPGRRARAVLLALIWGYSAVAALPLCVFFRVVPQRISICTLIWPTIPGEISWDVSFVTLNFLVPGLVIVISYSKILQITKASRKRLTVSLAYSESHQIRVSQQDFRLFRTLFLLMVSFFIMWSPIIITILLILIQNFKQDLVIWPSLFFWVVAFTFANSALNPILYNMTLCRN';
  var UBQ = 'MQIFVKTLTGKTITLEVEPSDTIENVKAKIQDKEGIPPDQQRLIFAGKQLEDGRTLSDYNIQKESTLHLVLRLRGG';
  var TUG = 'Cc1ccc(cc1)c2ccc(cc2COc3ccc(cc3)CCC(=O)O)F';

  function seg(options, value, onchange) {
    var s = el('div', { class: 'seg' });
    options.forEach(function (o) {
      var b = el('button', { type: 'button', class: o[0] === value ? 'on' : '' }, esc(o[1]));
      b.onclick = function () { Array.prototype.forEach.call(s.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); onchange(o[0]); };
      s.appendChild(b);
    });
    return s;
  }
  function field(label, node) { var w = el('div'); w.appendChild(el('label', { class: 'f' }, esc(label))); w.appendChild(node); return w; }
  function input(type, value, on) { var i = el('input', { type: type }); i.value = value; i.oninput = function () { on(i.value); }; return i; }
  function select(opts, value, on) {
    var s = el('select'); opts.forEach(function (o) { var op = el('option', { value: o[0] }, esc(o[1])); if (o[0] === value) op.selected = true; s.appendChild(op); });
    s.onchange = function () { on(s.value); }; return s;
  }
  function ids(n) { var out = [], a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; for (var i = 0; i < n; i++) out.push(a[i % 26] + (i >= 26 ? Math.floor(i / 26) : '')); return out; }

  /* ================= JSON BUILDER ================= */
  Hub.widget('jsonbuilder', function (host) {
    var st = { name: 'my_first_job', seeds: '1', ents: [] };
    function ent(type) { return { type: type, copies: 1, seq: '', mode: 'smiles', val: '', desc: '', msa: 'auto', tmpl: 'auto' }; }
    st.ents.push(ent('protein'));

    host.appendChild(el('h4', null, 'Input JSON builder'));
    host.appendChild(el('p', { style: 'color:var(--muted);margin-top:0;font-size:.9rem' }, 'Build your input file with forms. Chain IDs are assigned for you (A, B, C&hellip;). Nothing leaves your browser.'));
    var chips = el('div', { class: 'chips' });
    [['Blank protein', function () { st.name = 'my_first_job'; st.seeds = '1'; st.ents = [ent('protein')]; }],
     ['Example: ubiquitin', function () { st.name = 'ubiquitin_monomer'; st.seeds = '42'; var e = ent('protein'); e.seq = UBQ; e.desc = 'Human ubiquitin, 76 residues (UniProt P0CG48)'; st.ents = [e]; }],

     ['Example: homodimer (2 copies)', function () { st.name = 'homodimer_test'; st.seeds = '1'; var p = ent('protein'); p.copies = 2; p.seq = UBQ; p.desc = 'two copies of the same chain'; st.ents = [p]; }]
    ].forEach(function (c) { var b = el('button', { type: 'button' }, esc(c[0])); b.onclick = function () { c[1](); renderEnts(); update(); syncTop(); }; chips.appendChild(b); });
    host.appendChild(chips);

    var top = el('div', { class: 'row' });
    var nameIn = input('text', st.name, function (v) { st.name = v; update(); });
    var seedIn = input('text', st.seeds, function (v) { st.seeds = v; update(); });
    top.appendChild(field('Job name (becomes the output folder name)', nameIn));
    top.appendChild(field('Model seeds (comma separated whole numbers)', seedIn));
    host.appendChild(top);
    function syncTop() { nameIn.value = st.name; seedIn.value = st.seeds; }

    var entBox = el('div'); host.appendChild(entBox);
    var addRow = el('div', { class: 'chips' });
    [['protein', 'Add protein'], ['rna', 'Add RNA'], ['dna', 'Add DNA'], ['ligand', 'Add ligand / macrocycle / ion']].forEach(function (t) {
      var b = el('button', { type: 'button' }, '+ ' + esc(t[1])); b.onclick = function () { st.ents.push(ent(t[0])); renderEnts(); update(); }; addRow.appendChild(b);
    });
    host.appendChild(addRow);

    var msgs = el('ul', { class: 'msgs' }); host.appendChild(msgs);
    var outLabel = el('div'); host.appendChild(outLabel);
    var outBox = el('div'); host.appendChild(outBox);
    var actions = el('div', { class: 'chips noprint' }); host.appendChild(actions);

    function renderEnts() {
      entBox.innerHTML = '';
      var idMap = assignIds();
      st.ents.forEach(function (e, i) {
        var box = el('div', { class: 'ent' });

        head.appendChild(el('strong', null, esc(e.type.toUpperCase()) + ' &nbsp;<span class="pill">chain ' + esc(idMap[i].join(', ')) + '</span>'));
        var rm = el('button', { type: 'button', class: 'btn danger small' }, 'Remove');
        rm.onclick = function () { st.ents.splice(i, 1); renderEnts(); update(); };
        head.appendChild(rm); box.appendChild(head);
        if (e.type === 'ligand') {
          box.appendChild(seg([['smiles', 'SMILES'], ['ccd', 'CCD code(s)']], e.mode, function (v) { e.mode = v; renderEnts(); update(); }));
          var ta = el('textarea', { placeholder: e.mode === 'smiles' ? 'Paste SMILES, e.g. ' + TUG : 'e.g. ATP   (or MG for a magnesium ion; separate several with commas)' });
          ta.value = e.val; ta.oninput = function () { e.val = ta.value; update(); };
          box.appendChild(field(e.mode === 'smiles' ? 'SMILES (macrocycles and peptidomimetics go here, not in a protein entity)' : 'Chemical Component Dictionary code(s)', ta));
        } else {
          var ta2 = el('textarea', { placeholder: 'Paste the sequence (FASTA header lines and spaces/numbers are stripped for you)' });

          box.appendChild(field(e.type + ' sequence', ta2));

    }
    function update() {
      var job = s.job || 'my_job';
      var vols = ['    --volume $HOME/af3/input:/root/af_input', '    --volume $HOME/af3/output:/root/af_output', '    --volume /data/20260825_AndrewR_af3/models:/root/models', '    --volume /data/20260825_AndrewR_af3/databases:/root/public_databases'];
      if (s.cache) vols.push('    --volume $HOME/af3/jax_cache:/root/jax_cache');
      var env = s.unified ? ['    -e XLA_PYTHON_CLIENT_PREALLOCATE=false', '    -e TF_FORCE_UNIFIED_MEMORY=true', '    -e XLA_CLIENT_MEM_FRACTION=3.2'] : [];
      var gpu = '    --gpus ' + (s.gpuMode === 'all' ? 'all' : 'device=' + (parseInt(s.gpu, 10) || 0));
      var extra = [];
      if (s.seeds > 1) extra.push('--num_seeds=' + s.seeds);
      if (s.samples !== 5) extra.push('--num_diffusion_samples=' + s.samples);
      if (s.recycles !== 10) extra.push('--num_recycles=' + s.recycles);
      if (s.conf > 0) extra.push('--conformer_max_iterations=' + s.conf);
      if (s.tmplDate) extra.push('--max_template_date=' + s.tmplDate);
      if (s.cache) extra.push('--jax_compilation_cache_dir=/root/jax_cache');
      function cmd(inputPath, flags, useGpu) {
        var lines = ['docker run -it' + (s.rm ? ' --rm' : '')].concat(env, vols);
        if (useGpu) lines.push(gpu);
        lines.push('    alphafold3', '    python run_alphafold.py', '    --json_path=' + inputPath, '    --model_dir=/root/models', '    --output_dir=/root/af_output');
        flags.forEach(function (f) { lines.push('    ' + f); });
        return lines.join(' \\\n');
      }
      out.innerHTML = '';
      if (s.seeds > 1) out.appendChild(el('p', { style: 'font-size:.85rem;color:var(--muted)' }, '<code>--num_seeds</code> needs exactly <strong>one</strong> seed in your JSON; AF3 generates the rest starting from it.'));
      if (!s.split) {
        out.appendChild(U.codeBlock(cmd('/root/af_input/' + job + '.json', extra, true), 'one-shot run'));
      } else {
        out.appendChild(el('p', { style: 'margin-bottom:0' }, '<strong>Stage 1: CPU only.</strong> No GPU is requested, so nobody\'s card is tied up while the genetic search runs.'));
        out.appendChild(U.codeBlock(cmd('/root/af_input/' + job + '.json', ['--run_inference=false'], false), 'stage 1: data pipeline'));
        out.appendChild(el('p', { style: 'margin-bottom:0' }, '<strong>Stage 2: GPU.</strong> Uses the <code>' + esc(job) + '_data.json</code> that stage 1 wrote, because that file now contains the MSA. Copy it into your input folder first:'));
        out.appendChild(U.codeBlock('cp ~/af3/output/' + job + '/' + job + '_data.json ~/af3/input/' + job + '_data.json', 'copy the augmented input'));
        out.appendChild(U.codeBlock(cmd('/root/af_input/' + job + '_data.json', ['--run_data_pipeline=false', '--force_output_dir=true'].concat(extra), true), 'stage 2: inference'));
        out.appendChild(el('p', { style: 'font-size:.85rem;color:var(--muted)' }, 'The seed/sample/recycle flags belong to stage 2 (inference). If the stage-1 folder name differs because AF3 time-stamped it, adjust the path.'));
      }
      out.appendChild(el('p', { style: 'font-size:.85rem;color:var(--muted)' }, 'Run it inside <code>tmux</code> so it survives a dropped SSH connection (see the Foundations module).'));
    }
    update();
  });

  /* ================= SCORE CALCULATOR ================= */
  Hub.widget('scorecalc', function (host) {
    host.appendChild(el('h4', null, 'How ranking_score is made'));
    host.appendChild(el('p', { style: 'margin-top:0;color:var(--muted);font-size:.9rem' }, 'AF3 ranks its samples by <code>0.8 &times; ipTM + 0.2 &times; pTM + 0.5 &times; fraction_disordered &minus; 100 &times; has_clash</code>. Drag the sliders to see what moves it.'));
    var s = { i: 0.94, p: 0.87, d: 0.05, c: 0 };
    var out = el('div', { class: 'mono', style: 'font-size:1.1rem;margin:10px 0' }), rows = el('div');
    function sl(key, label, min, max, step) {
      var w = el('div'), lab = el('label', { class: 'f' }), r = el('input', { type: 'range', min: min, max: max, step: step, value: s[key], 'aria-label': label });
      lab.innerHTML = esc(label) + ': <strong></strong>';
      function show() { lab.querySelector('strong').textContent = s[key]; }
      r.oninput = function () { s[key] = parseFloat(r.value); show(); calc(); };
      show(); w.appendChild(lab); w.appendChild(r); rows.appendChild(w); r.style.width = '100%';
    }
    sl('i', 'ipTM', 0, 1, 0.01); sl('p', 'pTM', 0, 1, 0.01); sl('d', 'fraction_disordered', 0, 1, 0.01); sl('c', 'has_clash (0 or 1)', 0, 1, 1);
    host.appendChild(rows); host.appendChild(out);
    var foot = el('p', { style: 'font-size:.85rem;color:var(--muted)' }, 'Starting values are the real FFA4 + TUG-891 run: 0.8&times;0.94 + 0.2&times;0.87 + 0.5&times;0.05 = 0.95. For a single chain there is no ipTM, and AF3 uses pTM in its place (FFA4 alone: 0.8&times;0.88 + 0.2&times;0.88 + 0.5&times;0.06 = 0.91).');
    function calc() { var v = 0.8 * s.i + 0.2 * s.p + 0.5 * s.d - 100 * s.c; out.innerHTML = 'ranking_score = <strong style="color:' + (v > 0.8 ? 'var(--good)' : v > 0.6 ? 'var(--amber)' : 'var(--danger)') + '">' + v.toFixed(2) + '</strong>' + (s.c ? ' &nbsp;<span class="pill bad">a clash dominates everything</span>' : ''); }
    host.appendChild(foot); calc();
  });

  /* ================= RESULTS TRAINER (real data) ================= */
  Hub.widget('resulttrainer', function (host) {
    var D = window.AF3_REAL;
    host.appendChild(el('h4', null, 'Read a real result'));
    if (!D) { host.appendChild(el('p', null, 'Real example data is missing.')); return; }
    host.appendChild(el('p', { style: 'margin-top:0;color:var(--muted);font-size:.9rem' }, 'These are the actual outputs of the two FFA4 runs on Woody. Hover over the PAE plot to read values.'));
    var chips = el('div', { class: 'chips' }), body = el('div');
    var names = [['ffa4_monomer', 'FFA4 alone (monomer)'], ['ffa4_tug891', 'FFA4 + TUG-891 (complex)']];
    names.forEach(function (n, i) {
      var b = el('button', { type: 'button', class: i === 0 ? 'on' : '' }, esc(n[1])); b.onclick = function () { Array.prototype.forEach.call(chips.children, function (x) { x.classList.toggle('on', x === b); }); draw(n[0]); }; chips.appendChild(b);
    });
    host.appendChild(chips); host.appendChild(body);

    function pill(txt, cls) { return '<span class="pill ' + cls + '">' + txt + '</span>'; }
    function band(v) { return v >= 90 ? '#2a6fdb' : v >= 70 ? '#5bc0de' : v >= 50 ? '#f2c14e' : '#e8833a'; }
    function draw(key) {
      var d = D[key], s = d.summary, n = d.n;
      body.innerHTML = '';
      var rows = [
        ['ranking_score', s.ranking_score, s.ranking_score > 0.8 ? pill('strong', 'good') : s.ranking_score > 0.6 ? pill('grey zone', 'warn') : pill('weak', 'bad'), 'Overall score used to choose the best sample.'],
        ['ptm', s.ptm, s.ptm > 0.8 ? pill('confident', 'good') : s.ptm > 0.6 ? pill('grey zone', 'warn') : pill('low', 'bad'), 'Is the overall fold right?'],
        ['iptm', s.iptm == null ? 'null' : s.iptm, s.iptm == null ? pill('n/a: one chain', '') : s.iptm > 0.8 ? pill('confident', 'good') : s.iptm > 0.6 ? pill('grey zone', 'warn') : pill('low', 'bad'), s.iptm == null ? 'Nothing to dock with only one chain. Expected, not an error.' : 'Is the interface between chains right? The key number for binding.'],
        ['fraction_disordered', s.fraction_disordered, '', 'Share of the structure predicted to be unstructured.'],
        ['has_clash', s.has_clash, s.has_clash ? pill('clash', 'bad') : pill('none', 'good'), 'Any serious atomic overlaps?']
      ];
      body.appendChild(el('div', null, '<table><thead><tr><th>Metric</th><th>Value</th><th>Read as</th><th>Meaning</th></tr></thead><tbody>' + rows.map(function (r) { return '<tr><td><code>' + r[0] + '</code></td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>'; }).join('') + '</tbody></table>'));
      if (s.chain_pair_iptm && s.chain_pair_iptm.length > 1) {
        body.appendChild(el('div', { class: 'callout callout-note' }, '<span class="label">Do not be misled by chain_ptm of a small ligand</span><div>The ligand\'s own <code>chain_ptm</code> here is ' + s.chain_ptm[1] + '. A tiny molecule has no &ldquo;fold&rdquo; to score, so that value is not informative. Judge the pose with <code>chain_pair_iptm</code> for receptor&harr;ligand (' + s.chain_pair_iptm[0][1] + ') and with the PAE block below.</div>'));
      }
      // PAE
      var bin = atob(d.paeB64), pae = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) pae[i] = bin.charCodeAt(i);
      var wrap = el('div', { class: 'row', style: 'align-items:start;margin-top:14px' });
      var c1 = el('div'); c1.appendChild(el('label', { class: 'f' }, 'PAE: predicted aligned error (dark = confident about relative position)'));
      var cv = el('canvas', { width: n, height: n, style: 'width:100%;max-width:380px;image-rendering:pixelated' });
      var ctx = cv.getContext('2d'), im = ctx.createImageData(n, n);
      for (var k = 0; k < n * n; k++) { var v = Math.min(1, pae[k] / 8 / 30), r = 31 + (242 - 31) * v, g = 95 + (244 - 95) * v, b2 = 91 + (238 - 91) * v; im.data[k * 4] = r; im.data[k * 4 + 1] = g; im.data[k * 4 + 2] = b2; im.data[k * 4 + 3] = 255; }
      ctx.putImageData(im, 0, 0);
      var tip = el('div', { class: 'mono', style: 'font-size:.8rem;min-height:2.6em;color:var(--muted)' }, 'Hover the plot.');
      cv.onmousemove = function (ev) {
        var rc = cv.getBoundingClientRect(), x = Math.floor((ev.clientX - rc.left) / rc.width * n), y = Math.floor((ev.clientY - rc.top) / rc.height * n);
        if (x < 0 || y < 0 || x >= n || y >= n) return;
        tip.textContent = 'aligned on ' + d.tokenChains[y] + d.tokenResIds[y] + ', error at ' + d.tokenChains[x] + d.tokenResIds[x] + ': ' + (pae[y * n + x] / 8).toFixed(1) + ' Å';
      };
      c1.appendChild(cv); c1.appendChild(tip); wrap.appendChild(c1);
      var c2 = el('div');
      var nA = d.tokenChains.filter(function (c) { return c === 'A'; }).length, nB = n - nA;
      var txt = '<label class="f">What to look for</label><ul style="font-size:.9rem"><li><strong>The big dark square</strong> (top-left): the protein is internally well-defined.</li>';
      if (nB) {
        var tot = 0, cnt = 0; for (var yy = 0; yy < nA; yy++) for (var xx = nA; xx < n; xx++) { tot += pae[yy * n + xx] / 8; cnt++; }
        for (var y2 = nA; y2 < n; y2++) for (var x2 = 0; x2 < nA; x2++) { tot += pae[y2 * n + x2] / 8; cnt++; }
        txt += '<li><strong>The off-diagonal strips</strong> (right edge and bottom): receptor vs ligand. Their mean here is <strong>' + (tot / cnt).toFixed(1) + ' &Aring;</strong>. Low means AF3 is confident where the ligand sits relative to the receptor. This is the plot to check for a docking question.</li>';
      } else txt += '<li>One chain, so no interface block. Pale patches would be domains whose relative position is uncertain.</li>';
      txt += '</ul>';
      c2.innerHTML = txt; wrap.appendChild(c2); body.appendChild(wrap);
      // pLDDT
      var pl = d.residuePlddtA, cw = pl.length * 2;
      body.appendChild(el('label', { class: 'f', style: 'margin-top:14px' }, 'pLDDT per residue (blue &ge; 90 very high, cyan 70-90 confident, yellow 50-70 low, orange &lt; 50 very low)'));
      var pc = el('canvas', { width: cw, height: 80, style: 'width:100%' }), px = pc.getContext('2d');
      pl.forEach(function (v, i) { px.fillStyle = band(v); var h = v / 100 * 78; px.fillRect(i * 2, 80 - h, 2, h); });
      body.appendChild(pc);
      var mean = pl.reduce(function (a, b) { return a + b; }, 0) / pl.length, low = pl.filter(function (v) { return v < 70; }).length;
      var lp = '';
      if (d.ligandPlddt && d.ligandPlddt.length) lp = ' Ligand atoms average pLDDT <strong>' + (d.ligandPlddt.reduce(function (a, b) { return a + b; }, 0) / d.ligandPlddt.length).toFixed(0) + '</strong>.';
      body.appendChild(el('p', { style: 'font-size:.9rem' }, 'Mean protein pLDDT <strong>' + mean.toFixed(0) + '</strong>; <strong>' + low + '</strong> of ' + pl.length + ' residues are below 70 (typically loops and termini).' + lp));
    }
    draw('ffa4_monomer');
  });

  /* ================= TRIAGE GAME ================= */
  Hub.widget('triage', function (host, props) {
    var CASES = props.cases || [
      { src: 'real', t: 'FFA4 + TUG-891, a known agonist', m: 'ranking 0.95, ptm 0.87, iptm 0.94, chain_pair_iptm (A-B) 0.94, no clash', a: 0,
        why: 'Strong on every axis, and the compound is a real agonist, so this is the benchmark. Even so it is a prediction: a hypothesis about the pose, not a measurement.' },
      { src: 'illustrative', t: 'New candidate complex', m: 'ranking 0.64, ptm 0.82, iptm 0.58, no clash', a: 1,
        why: 'The receptor folds well (ptm 0.82) but the interface is below 0.6, so the binding mode is not reliable. Check PAE across the interface and run more seeds before believing anything. (ipTM near 0.6 in a result like this is also a reminder that AF3 may not be able to tell binders from non-binders.)' },
      { src: 'illustrative', t: 'Single protein', m: 'ranking 0.89, ptm 0.86, iptm null, 6% disordered', a: 0,
        why: 'iptm is null because there is only one chain: expected, not an error. The fold score is high.' },
      { src: 'illustrative', t: 'Peptide docked to a target', m: 'ranking -99.2, ptm 0.80, iptm 0.75, has_clash 1', a: 2,
        why: 'The clash penalty is 100, so the sample is dominated by overlapping atoms and the pose is physically unreasonable. Look at other samples/seeds; if all clash, the pose is not reliable.' },
      { src: 'illustrative', t: 'Five seeds of one macrocycle complex', m: 'ranking scores: 0.84, 0.83, 0.41, 0.84, 0.39; iptm 0.82 in the best', a: 1,
        why: 'The seeds disagree: two give a poor interface. Load the top-ranked structures from each seed in a viewer and compare the ligand position. Agreement between independent seeds is what builds trust.' },
      { src: 'illustrative', t: 'Designed binder', m: 'ranking 0.85, ptm 0.84, iptm 0.83, but interface PAE is 18 Å on one side', a: 1,
        why: 'The headline scores look good but the PAE says AF3 is unsure of the relative position. Headline numbers are averages: always look at the PAE plot for the interface you care about.' }
    ];
    var score = 0, answered = 0, i = 0;
    host.appendChild(el('h4', null, 'Triage practice'));
    host.appendChild(el('p', { style: 'margin-top:0;color:var(--muted);font-size:.9rem' }, 'Decide for each result: trust it, check it further, or do not trust it. Only the first case is a real run; the others are constructed to teach one point each.'));
    var card = el('div'); host.appendChild(card);
    var sc = el('div', { class: 'mono', style: 'margin-top:10px;font-size:.85rem;color:var(--muted)' }); host.appendChild(sc);
    function show() {
      card.innerHTML = '';
      if (i >= CASES.length) { card.appendChild(el('p', null, '<strong>Finished: ' + score + ' / ' + CASES.length + ' correct.</strong>')); var r = el('button', { class: 'btn small', type: 'button' }, 'Try again'); r.onclick = function () { i = 0; score = 0; answered = 0; show(); }; card.appendChild(r); sc.textContent = ''; return; }
      var c = CASES[i];
      card.appendChild(el('p', null, '<strong>Case ' + (i + 1) + ': ' + esc(c.t) + '</strong> <span class="pill">' + (c.src === 'real' ? 'real run' : 'illustrative numbers') + '</span><br><span class="mono">' + esc(c.m) + '</span>'));
      var fb = el('div', { class: 'callout', style: 'display:none' });
      var btns = ['Trust it', 'Check further', 'Do not trust'].map(function (lab, j) {
        var b = el('button', { type: 'button', class: 'btn ghost small', style: 'margin-right:8px' }, lab);
        b.onclick = function () {
          btns.forEach(function (x) { x.disabled = true; });
          if (j === c.a) score++;
          fb.style.display = ''; fb.className = 'callout ' + (j === c.a ? '' : 'callout-mistake');
          fb.innerHTML = '<span class="label">' + (j === c.a ? 'Correct' : 'Better answer: ' + ['Trust it', 'Check further', 'Do not trust'][c.a]) + '</span><div>' + c.why + '</div>';
          var nx = el('button', { type: 'button', class: 'btn small', style: 'margin-top:8px' }, i + 1 < CASES.length ? 'Next case' : 'Finish'); nx.onclick = function () { i++; show(); }; fb.appendChild(nx);
          sc.textContent = 'Score: ' + score + ' / ' + (i + 1);
        };
        return b;
      });
      var row = el('div'); btns.forEach(function (b) { row.appendChild(b); });
      card.appendChild(row); card.appendChild(fb);
    }
    show();
  });
})();

</script>
<script>
/* AlphaFold3 on Woody: complete beginner course.
 * Content is data. Facts here were checked against ~/af3/HOWTO.md, ~/alphafold3/run_alphafold.py and docs/.
 * Items marked TODO need a lab-specific value filled in by whoever maintains the course. */
(function () {
  'use strict';
  var p = function (html) { return { t: 'p', html: html }; };
  var h = function (text, id) { return { t: 'h', text: text, id: id }; };
  var sub = function (text) { return { t: 'sub', text: text }; };
  var ul = function (items, ordered) { return { t: 'list', items: items, ordered: !!ordered }; };
  var code = function (text, label) { return { t: 'code', text: text, label: label }; };
  var co = function (kind, label, html) { return { t: 'callout', kind: kind, label: label, html: html }; };
  var table = function (head, rows) { return { t: 'table', head: head, rows: rows }; };
  var check = function (title, items) { return { t: 'check', title: title, items: items }; };
  var quiz = function (q, opts, answer, why) { return { t: 'quiz', q: q, opts: opts, answer: answer, why: why }; };
  var widget = function (name, props) { return { t: 'widget', name: name, props: props }; };
  var os = function (o) { o.t = 'os'; return o; };

  var DOCKER_BASE =
    'docker run -it --rm \\\n' +
    '    --volume $HOME/af3/input:/root/af_input \\\n' +
    '    --volume $HOME/af3/output:/root/af_output \\\n' +
    '    --volume /data/20260825_AndrewR_af3/models:/root/models \\\n' +
    '    --volume /data/20260825_AndrewR_af3/databases:/root/public_databases \\\n' +
    '    --gpus device=[[2]] \\\n' +
    '    alphafold3 \\\n' +
    '    python run_alphafold.py \\\n' +
    '    --json_path=/root/af_input/[[ubiquitin_monomer.json]] \\\n' +
    '    --model_dir=/root/models \\\n' +
    '    --output_dir=/root/af_output';

  Hub.register({
    id: 'alphafold3',
    title: 'AlphaFold3 on Woody',
    blurb: 'From zero to a finished, correctly interpreted prediction: set up a run by hand, understand every parameter, tune it per experiment, and read the results.',
    modules: [

      /* ============ 0. FOUNDATIONS ============ */
      {
        id: 'foundations', title: 'Module 0: Foundations', skippable: true, lessons: [
          {
            id: 'get-on-woody', title: 'Getting onto Woody', blocks: [
              p('<strong>Woody</strong> is the group\'s shared Linux server. It has the GPUs, the AlphaFold3 install and all the genetic databases (~630 GB), so you never install anything yourself. You work on it remotely from your own laptop or desktop.'),
              co('summary', 'Before you start', '<p>You need three things from Andrew (or whoever administers Woody): an account (username + password or key), Woody\'s network address, and membership of the <code>docker</code> group. Without the last one, AlphaFold3 will refuse to start.</p>'),
              h('Two tools, two jobs'),
              p('You need a <strong>terminal</strong> for typing commands (create files, start runs, check the GPUs) and a <strong>file-transfer tool</strong> for moving files between your computer and Woody (uploading input JSONs, downloading results). Pick your operating system in the sidebar: the instructions below follow it.'),
              os({
                win: [
                  table(['Job', 'Tool'], [['Terminal', '<strong>PowerShell</strong> or <strong>Windows Terminal</strong>. Windows 10/11 already include <code>ssh</code>. Open the Start menu, type <code>powershell</code>, press Enter.'], ['File transfer', '<strong>WinSCP</strong> (free download), a drag-and-drop window.']]),
                  code('ssh [[your-username]]@woody.chem.gla.ac.uk', 'in PowerShell, on your own computer'),
                  ol_steps(['In WinSCP choose <strong>New Session</strong>. File protocol: SFTP. Host name: woody.chem.gla.ac.uk. Port 22. Your username.', 'Click <strong>Save</strong> and give the session a name (e.g. <code>woody</code>).', 'Log in. The left pane is your PC, the right is Woody. Drag files between them.'])
                ],
                mac: [
                  table(['Job', 'Tool'], [['Terminal', '<strong>Terminal</strong> (press Cmd+Space, type <code>Terminal</code>, Enter). <code>ssh</code>, <code>scp</code> and <code>rsync</code> are built in.'], ['File transfer', '<strong>Cyberduck</strong> (free, drag and drop; choose the SFTP protocol), or <code>scp</code> / <code>rsync</code> in Terminal.']]),
                  code('ssh [[your-username]]@woody.chem.gla.ac.uk', 'in Terminal, on your own computer'),
                  ol_steps(['In Cyberduck choose <strong>Open Connection</strong>. Protocol: SFTP. Server: woody.chem.gla.ac.uk. Port 22. Your username.', 'Bookmark it so you can reconnect in one click.', 'Drag files between the Cyberduck window and Finder.'])
                ],
                linux: [
                  table(['Job', 'Tool'], [['Terminal', 'Any terminal (often Ctrl+Alt+T). <code>ssh</code>, <code>scp</code> and <code>rsync</code> are normally installed.'], ['File transfer', 'Your file manager: choose <em>Connect to Server</em> and enter <code>sftp://your-username@woody.chem.gla.ac.uk</code>. Or use <code>scp</code> / <code>rsync</code> in the terminal.']]),
                  code('ssh [[your-username]]@woody.chem.gla.ac.uk', 'in a terminal, on your own computer')
                ]
              }),
              p('Replace the two highlighted parts. The first time you connect, it asks you to trust the server: type <code>yes</code>. When it works you will see a prompt such as <code>[you@woody ~]$</code>. That <code>$</code> means Woody is waiting for a command. Every command block in this course is typed on Woody unless its label says <em>on your own computer</em>.'),
              co('todo', 'TODO for the lab', '<p>Woody\'s address is <code>woody.chem.gla.ac.uk</code>. Still to confirm: whether off-campus access needs the university VPN. Until a maintainer fills that in, ask your supervisor or the lab admin before you try from home.</p>'),
              check('Checkpoint', ['I can log in with SSH and see a prompt ending in $', 'I can see my Woody home folder in my file-transfer tool', 'I know my username and who to ask about the docker group']),
              quiz('You see the prompt <code>[you@woody ~]$</code>. Where are you?', ['On my own laptop', 'On Woody, in my home folder', 'Inside the AlphaFold3 container'], 1, 'The <code>~</code> means your home folder, and <code>woody</code> is the machine you are logged in to.')
            ]
          },
          {
            id: 'terminal-basics', title: 'Terminal survival kit', blocks: [
              p('You only need about a dozen commands. Type each one in the Woody terminal and press Enter. Nothing here can break AlphaFold3 itself, but <code>rm</code> deletes permanently, so read before you press Enter.'),

                ['<code>ls</code> / <code>ls -l</code>', 'List files here (<code>-l</code> shows sizes and owners)'],
                ['<code>cd folder</code>', 'Go into a folder. <code>cd ..</code> goes up. <code>cd</code> alone goes home'],

                ['<code>nano file.json</code>', 'Edit a file in the terminal. Save: Ctrl+O then Enter. Exit: Ctrl+X'],

              h('tmux: keep a job alive when you disconnect'),

              code('tmux new -s af3        # start a named session; run your job inside it\n# detach (job keeps running): press Ctrl+B, release, then press D\ntmux ls                # list sessions\ntmux attach -t af3     # come back to it later', 'on Woody'),
              check('Checkpoint', ['I created ~/af3/input and ~/af3/output', 'I can open a file with nano and save it', 'I started and detached from a tmux session, then re-attached'])
            ]
          },
          {
            id: 'woody-layout', title: 'Docker, GPUs and where things live', blocks: [
              h('The map'),
              table(['Path', 'What it is', 'Yours to change?'], [
                ['<code>~/af3/input/</code>', 'Your input JSON files', 'Yes'],
                ['<code>~/af3/output/</code>', 'Results, one folder per job', 'Yes'],
                ['<code>~/af3/logs/</code>', 'Optional: logs of runs', 'Yes'],
                ['<code>/data/20260825_AndrewR_af3/models/</code>', 'AlphaFold3 model weights, shared', '<strong>No</strong>'],
                ['<code>/data/20260825_AndrewR_af3/databases/</code>', 'Genetic databases (~630 GB), shared', '<strong>No</strong>'],
                ['<code>~/alphafold3/</code>', 'The AlphaFold3 code (examples are in <code>examples/</code>)', 'Read only for you']

              p('AlphaFold3 and everything it depends on is packaged into a self-contained <strong>image</strong> called <code>alphafold3</code>. <code>docker run</code> starts a <strong>container</strong> from that image, a temporary sealed box in which the program runs. The box cannot see Woody\'s folders unless you <strong>mount</strong> them with <code>--volume woody-folder:path-inside-box</code>. That is why the run command has four <code>--volume</code> lines: they connect your input, your output, the weights and the databases to the box.'),

      /* ============ 1. CONCEPTS ============ */
      {
        id: 'concepts', title: 'Module 1: The ideas', lessons: [
          {
            id: 'what-is-af3', title: 'What AlphaFold3 does (and does not)', blocks: [
              p('AlphaFold3 (AF3) predicts the 3D structure of biological molecules and, importantly for this group, of molecules <strong>bound to each other</strong>: a protein with another protein, a peptide, a macrocycle, a small molecule, DNA, RNA or ions.'),
              h('Co-folding, not docking'),
              p('Classic docking (AutoDock, Glide) takes a fixed receptor and scores many candidate poses of a ligand. AF3 does something different: you give it the sequences and the ligand\'s chemical structure, and it <strong>builds the whole bound complex from scratch</strong> in one go. You do not get a ranked list of poses. You get a handful of predicted structures and some confidence scores that tell you how far to trust them.'),
              h('What happens in a run'),
              ol_steps(['<strong>Data pipeline (CPU).</strong> AF3 searches big sequence databases for evolutionary relatives of your protein, building a <em>multiple sequence alignment (MSA)</em>, and looks for similar known structures (<em>templates</em>). This is the slow part. For FFA4 (297 residues) it took about 440 seconds.', '<strong>Inference (GPU).</strong> The neural network turns that information into 3D coordinates, using a <em>diffusion</em> process that starts from noise and refines it. For FFA4 this took about 53 seconds for 5 structures.', '<strong>Ranking.</strong> Each structure gets confidence scores; the best is saved as the main answer.']),
              co('note', 'Why this matters for planning', '<p>The slow stage needs no GPU and depends only on the <em>protein</em>. That is why you can split the run into two stages and, when screening many ligands against one target, pay for the search only once. The tuning module returns to this.</p>'),
              h('Limits you should keep in mind'),
              ul(['A prediction is a <strong>hypothesis</strong>, not a measurement. High confidence is not proof.', 'AF3 can look confident and still be wrong, especially for interactions it has never seen anything like.', 'It does not predict binding <em>affinity</em>. A high interface score does not mean a potent compound.', 'The training data contains few macrocycles and peptidomimetics, so treat those poses with extra scepticism and always compare to a known control (we use TUG-891 for FFA4).']),
              quiz('AF3 returns a single structure with a high interface confidence for your new compound. What does that tell you?', ['The compound is a potent binder', 'AF3 is confident about the predicted binding mode, which you should now treat as a hypothesis to test', 'The compound will be active in a cell assay'], 1, 'Confidence is about the structure, not affinity or biological activity. It tells you how much to trust the predicted pose.')
            ]
          },
          {
            id: 'vocab', title: 'Vocabulary you will meet', blocks: [
              table(['Term', 'Plain meaning'], [
                ['<strong>Entity / chain</strong>', 'One molecule in your input (a protein, a ligand, a strand of DNA). Each gets a chain ID: A, B, C&hellip;'],
                ['<strong>Sequence</strong>', 'Letters for a protein (<code>MKV&hellip;</code>), RNA (ACGU) or DNA (ACGT). From UniProt for proteins.'],
                ['<strong>SMILES</strong>', 'A line of text that describes a small molecule or macrocycle\'s structure. How non-protein things enter AF3. PubChem lists them.'],
                ['<strong>CCD code</strong>', 'A short PDB code for a standard chemical, e.g. ATP, MG (magnesium ion), HEM.'],
                ['<strong>MSA</strong>', 'A pile of related sequences lined up against yours. Co-varying positions hint at 3D contacts.'],
                ['<strong>Template</strong>', 'A known PDB structure used as a hint.'],
                ['<strong>Seed</strong>', 'A number controlling the random sampling. Different seeds can give different structures.'],
                ['<strong>Sample</strong>', 'One predicted structure. Default is 5 per seed.'],
                ['<strong>Token</strong>', 'AF3\'s size unit: one per amino acid or nucleotide, and one per heavy atom of a ligand. Size drives memory.'],
                ['<strong>pLDDT</strong>', 'Per-atom local confidence, 0-100.'],
                ['<strong>PAE</strong>', 'Predicted error (&Aring;) in the position of one part, judged from another. Great for interfaces.'],
                ['<strong>pTM / ipTM</strong>', 'Whole-fold confidence / interface confidence, 0-1.'],
                ['<strong>Macrocycle</strong>', 'A large ring molecule, often a cyclised peptide. Goes in as a SMILES ligand.']
              ]),
              quiz('A cyclic peptide with a D-amino acid should be entered as&hellip;', ['A protein entity with the sequence', 'A ligand entity with a SMILES string', 'Two protein entities'], 1, 'The protein entity only understands linear chains of the 20 natural amino acids. Rings and non-natural chemistry need SMILES.')
            ]
          }
        ]
      },

          {
            id: 'ubiquitin', title: 'Fold a protein, start to finish', blocks: [

              h('Step 1: make the input file'),
              p('Everything AF3 needs to know goes in one <strong>JSON</strong> file. Use the builder: click <strong>Example: ubiquitin</strong>, look at the output, then use <strong>Copy &ldquo;save on Woody&rdquo; command</strong> and paste it into your Woody terminal.'),

              co('note', 'Prefer a file-transfer tool?', '<p>Use <strong>Download .json</strong>, then drag the file into <code>~/af3/input</code> in WinSCP / Cyberduck / your file manager. Same result.</p>'),
              h('Step 2: pick a GPU and start tmux'),

              h('Step 3: launch'),

              code(DOCKER_BASE, 'on Woody, inside tmux'),
              p('You will see a stream of log lines. There is no progress bar. A small protein may take only a few minutes; <strong>FFA4 at 297 residues took ~7 minutes just for the search</strong>. Long silence without GPU activity is normal during the search.'),
              co('mistake', 'Do not', '<ul><li>Close the terminal without tmux.</li><li>Start a second job on the same GPU without checking it is free.</li><li>Re-run with the same <code>name</code> expecting an overwrite: AF3 makes a new time-stamped folder instead.</li></ul>'),
              h('Step 4: look at the result'),
              code('ls ~/af3/output/ubiquitin_monomer', 'on Woody'),
              code('ubiquitin_monomer_model.cif                 <- the best predicted structure\nubiquitin_monomer_summary_confidences.json  <- the headline scores\nubiquitin_monomer_confidences.json          <- per-atom pLDDT and the PAE matrix\nubiquitin_monomer_ranking_scores.csv        <- score of every sample\nubiquitin_monomer_data.json                 <- your input plus the MSA/templates AF3 used\nseed-42_sample-0/ ... sample-4/             <- all individual predictions', 'what you should see'),
              p('Print the headline scores:'),

              co('practice', 'Next', '<p>Open Module 2, lesson 2 to learn exactly what each line of that command does, so you can change it with confidence.</p>')

              table(['Part', 'Meaning', 'Change it?'], [
                ['<code>docker run -it</code>', 'Start a container; <code>-it</code> keeps it interactive so you see the log', 'No'],
                ['<code>--rm</code>', 'Delete the stopped container afterwards so they do not pile up. Results are safe in your mounted output folder.', 'Optional'],
                ['<code>--volume $HOME/af3/input:/root/af_input</code>', 'Make Woody\'s <code>~/af3/input</code> appear inside the container as <code>/root/af_input</code>', 'No'],
                ['<code>--volume $HOME/af3/output:/root/af_output</code>', 'Same for output. Results are written here', 'No'],
                ['<code>--volume &hellip;/models:/root/models</code>', 'The shared model weights', 'No'],
                ['<code>--volume &hellip;/databases:/root/public_databases</code>', 'The shared genetic databases', 'No'],
                ['<code>--gpus device=2</code>', 'Which GPU the container may use', '<strong>Yes: every run</strong>'],
                ['<code>alphafold3</code>', 'The image to run', 'No'],
                ['<code>python run_alphafold.py</code>', 'The program inside the container', 'No'],
                ['<code>--json_path=/root/af_input/X.json</code>', 'Your input, <em>as seen from inside the container</em>', '<strong>Yes: every run</strong>'],
                ['<code>--model_dir=/root/models</code>', 'Where the weights are, inside the container', 'No'],
                ['<code>--output_dir=/root/af_output</code>', 'Where to write results, inside the container', 'No']

              co('note', 'Two sets of paths', '<p>Paths starting <code>/root/&hellip;</code> exist only <em>inside</em> the container. The left side of each <code>--volume</code> is the real Woody path; the right side is what the program sees. You will mostly only edit the file name and the GPU number.</p>'),
              p('Everything beyond this baseline (extra flags, environment variables, splitting stages) is added by the <strong>Command builder</strong> in the next module.'),
              quiz('You get &ldquo;No such file or directory: /root/af_input/my_job.json&rdquo;. What is the most likely cause?', ['The weights are missing', 'The file is not in ~/af3/input, or the name is spelled differently', 'The GPU is busy'], 1, 'The container sees your ~/af3/input folder as /root/af_input. If the file is not in that folder (or the name differs), it cannot be found.')
            ]
          },
          {
            id: 'anatomy-json', title: 'Anatomy of the input JSON', blocks: [
              p('Take the FFA4 + TUG-891 file apart. Load it in the builder below and compare with the explanation.'),
              widget('jsonbuilder'),
              table(['Field', 'Meaning', 'Notes'], [
                ['<code>name</code>', 'Job name; the output folder is named after it', 'Letters, numbers, <code>_ - .</code>'],
                ['<code>sequences</code>', 'The list of molecules', 'Each is a <code>protein</code>, <code>rna</code>, <code>dna</code> or <code>ligand</code> object'],
                ['<code>id</code>', 'The chain label (A, B&hellip;). A list means identical copies', 'The builder assigns these'],
                ['<code>sequence</code>', 'The residues', 'Standard letters only'],
                ['<code>smiles</code> / <code>ccdCodes</code>', 'How a ligand is defined', 'One or the other'],
                ['<code>description</code>', 'Free text for your records', 'Optional but strongly recommended'],

      /* ============ 3. TUNING ============ */
      {
        id: 'tuning', title: 'Module 3: Parameters and tuning', lessons: [
          {
            id: 'parameter-explorer', title: 'The parameter explorer', blocks: [
              p('AF3 has few settings that matter. This is every one the group is likely to touch, with <strong>our default, why we use it, and when to change it for an experiment</strong>. Open a card to read it.'),
              widget('paramref', { cats: ['Input JSON', 'Sampling', 'Running it', 'GPU & memory', 'Outputs'], title: 'Parameter explorer' }),
              co('summary', 'The short version', '<p>For a first look: defaults, one seed, one idle GPU. For a result you will report: three to five seeds. For floppy ligands or macrocycles: more samples. Only touch memory settings if a job runs out of memory.</p>'),
              quiz('A designed peptide has no natural relatives. A good experiment to ask whether AF3 is just reproducing evolutionary signal is&hellip;', ['Raise num_recycles to 50', 'Set unpairedMsa and pairedMsa to empty strings (MSA-free run)', 'Use --gpus all'], 1, 'An empty string tells AF3 not to search. Comparing MSA and MSA-free runs shows how much of the prediction depends on evolutionary information.')
            ]
          },
          {
            id: 'command-builder', title: 'The command builder', blocks: [
              p('Choose the recipe closest to your experiment and the builder produces the exact command. You can still tweak every field. Read the <em>Why this recipe</em> note each time: the point is to understand the choice, not just copy the output.'),
              widget('cmdbuilder'),
              co('note', 'JSON still matters', '<p>Some choices live in the input file, not the command (seeds list, MSA on/off, templates, copies). Use the JSON builder for those. Seeds can be given either way; <code>--num_seeds=N</code> requires exactly one seed in the JSON.</p>'),

          },
          {
            id: 'stages-screening', title: 'Splitting stages and screening many ligands', blocks: [
              p('The CPU search depends only on the <strong>protein</strong>, and for FFA4 it took ~440 s of a ~500 s run. If you want to test twenty macrocycles against the same receptor, searching twenty times is wasted effort. AF3 lets you do the search once.'),
              h('Stage 1: search only'),
              p('Run once on your receptor plus any one ligand, with <code>--run_inference=false</code> and no GPU. The output folder gets a <code>&lt;name&gt;_data.json</code>: your input with the MSA and templates filled in.'),
              h('Stage 2: predict only'),
              p('Run inference with <code>--run_data_pipeline=false</code>, giving the <strong><code>_data.json</code></strong> as input. Using your original JSON here does not work, because it has no MSA in it.'),
              co('mistake', 'Check this against the older HOWTO', '<p>The Woody HOWTO\'s staging example reuses the original JSON for stage 2. According to the AF3 docs (<code>docs/performance.md</code>) inference-only runs need the pre-computed MSAs in the input, i.e. the <code>_data.json</code>. Use the version in this course until the HOWTO is confirmed or corrected.</p>'),
              h('Swapping ligands without re-searching'),

              co('practice', 'Rules of thumb', '<ul><li>Only the ligand changes: its entry has no MSA, so nothing needs re-searching.</li><li>If you change the <em>protein</em> sequence, you must redo the search.</li><li>Give every candidate a unique <code>name</code>, or the outputs will collide.</li></ul>'),

            ]
          }

            ]

              co('practice', 'Colour by confidence', '<p>AF3 writes pLDDT into the B-factor column of the <code>.cif</code>. In ChimeraX: <code>color bfactor palette alphafold</code>. Blue regions are well predicted; orange regions are guesses.</p>'),

                ['<code>ptm</code>', '0-1', '&gt; 0.8 confident fold; 0.6-0.8 grey zone; &lt; 0.6 probably wrong'],
                ['<code>iptm</code>', '0-1 or null', 'Same bands, but about the interface between chains. null for a single chain'],
                ['<code>chain_pair_iptm</code>', '0-1', 'Confidence for one specific pair of chains, e.g. receptor vs ligand'],
                ['<code>fraction_disordered</code>', '0-1', 'Share predicted unstructured'],
                ['<code>has_clash</code>', '0 / 1', '1 means physical overlaps. Treat the sample with suspicion']
              ]),
              widget('resulttrainer'),
              h('How the ranking score is built'),
              widget('scorecalc'),
              co('mistake', 'Common misreadings', '<ul><li>iptm <em>null</em> on a single chain is normal.</li><li>A tiny ligand\'s own <code>chain_ptm</code> is meaningless.</li><li>A high average can hide a bad interface: check the PAE block.</li><li>A good score on one seed is not reproducibility. Run more.</li><li>Confidence is not affinity.</li></ul>'),
              quiz('A complex has ptm 0.85, iptm 0.55. What is the most sensible reading?', ['Both chains are individually well folded, but the interface is not trustworthy', 'The complex is perfect', 'The run failed'], 0, 'ptm describes the overall fold; iptm describes the interface. The interface falls below the 0.6 line, so the binding mode should not be trusted without further evidence.')
            ]
          },
          {
            id: 'triage', title: 'Triage practice', blocks: [
              p('Decide quickly and defend it. One real result, five constructed ones.'),

            ]
          }
        ]
      },

      /* ============ 6. GOOD PRACTICE ============ */
      {
        id: 'practice', title: 'Module 6: Good practice', lessons: [
          {
            id: 'etiquette-trouble', title: 'Shared GPUs and troubleshooting', blocks: [
              h('Be a good neighbour'),
              ul(['Run <code>nvidia-smi</code> first. Choose an idle card with <code>--gpus device=N</code>.', 'Use the CPU-only stage 1 for long searches: it holds no GPU.', 'Run inside <code>tmux</code>, and check on the job rather than leaving it forgotten.', 'Do not queue dozens of jobs without telling the group.', 'Name jobs sensibly (<code>target_ligand_date</code>) so folders can be found and cleaned up later.']),
              h('When something goes wrong'),
              table(['Symptom', 'Likely cause', 'What to do'], [
                ['<code>permission denied</code> on Docker', 'Not in docker group, or not re-logged-in', 'Ask the administrator; log out and in'],
                ['No such file /root/af_input/&hellip;', 'File not in ~/af3/input or name mismatch', '<code>ls ~/af3/input</code>; fix the name'],
                ['Silence for 10+ minutes, GPU idle', 'Normal: CPU search', 'Wait. Check CPU with <code>htop</code>'],
                ['Out of memory during inference', '24 GB card too small for this size', 'Add the unified-memory variables (Command builder). If still failing, the target is too big'],
                ['<code>Failed to construct RDKit reference structure</code>', 'Bad SMILES or hard macrocycle', 'Check SMILES; raise <code>--conformer_max_iterations</code>'],
                ['JSON error', 'Syntax, backslashes, bad characters', '<code>python3 -m json.tool file.json</code>; use the builder'],
                ['Output folder has a date suffix', 'Same job name as an earlier run', 'Expected. Rename jobs or use <code>--force_output_dir=true</code> deliberately'],
                ['Run vanished when I closed my laptop', 'Not in tmux', 'Always use tmux'],
                ['Cannot delete old output', 'Files owned by root', 'Ask the administrator']
              ]),
              p('The full flag list is always available from the program itself:'),
              code('docker run --rm alphafold3 python run_alphafold.py --help | less', 'on Woody (q to quit)'),
              h('Terms of use'),
              p('Every output folder contains <code>TERMS_OF_USE.md</code>. AF3\'s model parameters have their own terms; read it before publishing anything. Check with the group before sharing outputs externally.')
            ]
          },
          {
            id: 'cheatsheet', title: 'Cheat sheet and final quiz', blocks: [
              p('Use the <strong>Print page</strong> button in the sidebar to print or save this page as a PDF.'),
              h('One-page recipe'),
              ol_steps(['Log in, <code>tmux new -s af3</code>, <code>nvidia-smi</code> to find an idle GPU.', 'Build the JSON, save in <code>~/af3/input</code>, validate with <code>python3 -m json.tool</code>.', 'Generate the command; set <code>device=N</code> and the file name; run.', 'Wait. Results appear in <code>~/af3/output/&lt;name&gt;/</code>.', 'Read <code>summary_confidences.json</code>: clash, ptm, iptm, ranking_score.', 'Open <code>_model.cif</code> in a viewer coloured by confidence; look at PAE.', 'Compare to a control; add seeds before believing it.']),
              code(DOCKER_BASE, 'the baseline command'),
              h('Final quiz'),
              quiz('Which file do you pass as input for an inference-only (stage 2) run?', ['The original JSON', 'The _data.json written by stage 1', 'The .cif model'], 1, 'Only _data.json contains the MSA and templates stage 2 needs.'),
              quiz('You want a stable estimate of a macrocycle\'s binding pose. Which is the best plan?', ['One seed, one sample, as fast as possible', 'Several seeds and more samples, compared against a control compound', 'Skip the MSA'], 1, 'Flexible ligands need sampling breadth, and a control puts the numbers in context.'),
              quiz('A job fails with out-of-memory on a large complex. First thing to try?', ['--gpus all', 'Enable the unified-memory environment variables', 'Raise num_recycles'], 1, 'Unified memory lets the GPU spill into system RAM, at some cost in speed.'),
              quiz('What does iptm = null mean?', ['The run crashed', 'There is only one chain, so there is no interface to score', 'The ligand was ignored'], 1, 'No interface exists to be scored, so AF3 reports null.'),
              check('You are ready when', ['I can log in and find an idle GPU', 'I can build, validate and save an input JSON', 'I can launch a run inside tmux', 'I can explain what each command line does', 'I can pick the settings for a specific experiment', 'I can judge a result using scores and PAE and know what it cannot tell me'])
            ]
          }
        ]
      }
    ]
  });

  function ol_steps(items) { return { t: 'list', ordered: true, items: items }; }
})();

<script>

(function () {

  function field(label, node) { var w = el('div'); w.appendChild(el('label', { class: 'f' }, esc(label))); w.appendChild(node); return w; }

  function seg(options, value, onchange) {

  }
  function ids(n) { var out = [], a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; for (var i = 0; i < n; i++) out.push(a[i % 26] + (i >= 26 ? Math.floor(i / 26) : '')); return out; }
